<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arm and Hand · Guided Imagery Practice · Living Beyond Stroke</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="description" content="A guided imagery practice for arm and hand recovery after stroke. Motor imagery of reaching, grasping, and fine motor movement. Research-grounded, free.">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--cream:#F5F0E8;--warm-white:#FAF8F4;--charcoal:#2A2820;--bark:#5C4A2A;--gold:#C8963C;--muted:#7A7060;--border:#E0D8C8;}
  *{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
  body{font-family:'DM Sans',sans-serif;background:var(--warm-white);color:var(--charcoal);font-size:16px;line-height:1.75;}
  nav{position:sticky;top:0;z-index:100;background:var(--charcoal);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:60px;border-bottom:2px solid var(--gold);}
  .nav-brand{font-family:'Lora',serif;font-size:1.1rem;color:var(--cream);letter-spacing:0.03em;text-decoration:none;}
  .nav-brand span{color:var(--gold);}
  .nav-links{display:flex;gap:2rem;list-style:none;}
  .nav-links a{color:#C8C0B0;text-decoration:none;font-size:0.85rem;font-weight:400;letter-spacing:0.06em;text-transform:uppercase;transition:color 0.2s;}
  .nav-links a:hover{color:var(--gold);}
  .hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:0;}
  .hamburger span{width:24px;height:1.5px;background:var(--cream);display:block;}
  .mobile-menu{display:none;background:var(--charcoal);border-top:1px solid rgba(255,255,255,0.08);padding:1rem 1.5rem;flex-direction:column;gap:0;}
  .mobile-menu.open{display:flex;}
  .mobile-menu a{color:#C8C0B0;text-decoration:none;font-size:0.9rem;letter-spacing:0.06em;text-transform:uppercase;padding:0.85rem 0;border-bottom:1px solid rgba(255,255,255,0.06);transition:color 0.2s;}
  .mobile-menu a:last-child{border-bottom:none;}
  .mobile-menu a:hover{color:var(--gold);}

  .page-hero{background:var(--charcoal);padding:4rem 0 3rem;border-bottom:1px solid rgba(200,150,60,0.2);}
  .hero-inner{max-width:860px;margin:0 auto;padding:0 2.5rem;}
  .breadcrumb{font-size:0.72rem;color:#5A5040;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:1.5rem;display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap;}
  .breadcrumb a{color:#5A5040;text-decoration:none;}.breadcrumb a:hover{color:var(--gold);}
  .breadcrumb-sep{opacity:0.4;}
  .article-eyebrow{font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);margin-bottom:0.75rem;display:flex;align-items:center;gap:0.6rem;}
  .article-eyebrow::before{content:'';width:24px;height:1px;background:var(--gold);display:block;}
  .article-h1{font-family:'Lora',serif;font-size:clamp(1.8rem,3.5vw,2.8rem);line-height:1.2;color:var(--cream);font-weight:400;margin-bottom:1rem;}
  .article-standfirst{font-size:1.05rem;color:#8A8070;line-height:1.8;max-width:680px;margin-bottom:1.75rem;}
  .article-meta{display:flex;gap:2rem;flex-wrap:wrap;}
  .meta-item{font-size:0.75rem;color:#5A5040;letter-spacing:0.06em;}
  .meta-item strong{color:#A89E8C;font-weight:400;}

  .article-body{max-width:860px;margin:0 auto;padding:3.5rem 2.5rem 5rem;}
  h2.section-head{font-family:'Lora',serif;font-size:1.4rem;font-weight:400;color:var(--charcoal);margin:3rem 0 1rem;padding-bottom:0.6rem;border-bottom:1px solid var(--border);}
  h3.sub-head{font-size:0.95rem;font-weight:500;color:var(--bark);margin:1.75rem 0 0.6rem;letter-spacing:0.02em;}
  p.body-text{font-size:0.97rem;color:#4A4438;line-height:1.9;margin-bottom:1rem;}

  /* PRACTICE CONSOLE */
  .practice-console{background:var(--charcoal);padding:2.5rem;margin-bottom:3rem;border:1px solid rgba(200,150,60,0.15);}
  .console-label{font-size:0.68rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);margin-bottom:1.25rem;display:flex;align-items:center;gap:0.6rem;}
  .console-label::before{content:'';width:18px;height:1px;background:var(--gold);display:block;}
  .audio-block{margin-bottom:1.5rem;}
  .audio-target{font-family:'Lora',serif;font-size:1.4rem;color:var(--cream);font-weight:400;margin-bottom:0.3rem;}
  .audio-duration{font-size:0.75rem;color:var(--gold);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:1.25rem;}
  audio{width:100%;height:42px;}
  .console-note{font-size:0.72rem;color:#5A5040;letter-spacing:0.04em;font-style:italic;padding-top:1.25rem;border-top:1px solid rgba(200,150,60,0.1);}

  /* PHASE CARDS */
  .phase-list{margin:1.5rem 0 2rem;}
  .phase-card{border-left:3px solid var(--gold);padding:1.5rem 1.75rem;background:rgba(200,150,60,0.04);margin-bottom:1px;}
  .phase-eyebrow{font-size:0.68rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);margin-bottom:0.4rem;}
  .phase-title{font-family:'Lora',serif;font-size:1.1rem;color:var(--charcoal);font-weight:400;margin-bottom:0.6rem;}
  .phase-card p{font-size:0.92rem;color:#4A4438;line-height:1.85;margin-bottom:0.75rem;}
  .phase-card p:last-child{margin-bottom:0;}

  /* PATHWAY IMAGE PLACEHOLDER */
  .pathway-image{margin:1.25rem 0 0;border-top:1px solid rgba(200,150,60,0.15);padding-top:1.25rem;}
  .pathway-image figure{margin:0;}
  .pathway-image svg{width:100%;height:auto;display:block;margin:0 auto 0.9rem;}
  .pathway-image figcaption{font-size:0.82rem;color:var(--muted);line-height:1.7;font-style:italic;text-align:center;max-width:460px;margin:0 auto;}
  .pathway-note{font-size:0.78rem;color:#A89C84;line-height:1.7;text-align:center;max-width:520px;margin:0.75rem auto 0;}
  .diagram-label{font-family:'DM Sans',system-ui,sans-serif;font-size:12.5px;letter-spacing:0.11em;text-transform:uppercase;fill:var(--muted);}
  .diagram-note{font-family:'DM Sans',system-ui,sans-serif;font-size:11.5px;letter-spacing:0.14em;text-transform:uppercase;fill:var(--gold);}
  .legend-label{font-family:'DM Sans',system-ui,sans-serif;font-size:12.5px;letter-spacing:0.04em;fill:var(--muted);}
  .route{fill:none;stroke:var(--gold);stroke-linecap:round;stroke-linejoin:round;}
  .route-trunk{stroke-width:2.6;}
  .route-branch{stroke-width:1.7;}
  .route-segment{stroke-width:5;}
  @media(prefers-reduced-motion:no-preference){
    .route{stroke-dasharray:640;stroke-dashoffset:640;animation:trace 2.8s cubic-bezier(0.4,0,0.2,1) forwards;}
    .route-branch{animation-delay:1.1s;}
    .terminus{opacity:0;animation:settle 1.2s ease forwards;animation-delay:2.4s;}
  }
  @keyframes trace{to{stroke-dashoffset:0;}}
  @keyframes settle{to{opacity:1;}}
  @media(max-width:780px){
    .diagram-label{font-size:17px;letter-spacing:0.06em;}
    .diagram-note{font-size:16px;letter-spacing:0.08em;}
    .legend-label{font-size:17px;}
  }

  /* TIMING CARDS */
  .timing-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);margin:1.5rem 0;}
  .timing-card{background:var(--warm-white);padding:1.5rem;}
  .timing-label{font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);margin-bottom:0.4rem;}
  .timing-title{font-family:'Lora',serif;font-size:0.95rem;color:var(--charcoal);font-weight:400;margin-bottom:0.5rem;}
  .timing-card p{font-size:0.84rem;color:#5A5040;line-height:1.75;}

  /* AUDIO DISCLOSURE */
  .audio-disclosure{background:var(--cream);border:1px solid var(--border);padding:1.75rem 2rem;margin:2rem 0;}
  .audio-disclosure-label{font-size:0.68rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);margin-bottom:0.75rem;}
  .audio-disclosure p{font-size:0.88rem;color:#5A5040;line-height:1.8;margin-bottom:0.6rem;}
  .audio-disclosure p:last-child{margin-bottom:0;}

  /* ACADEMIC NOTE */
  .academic-note{background:var(--cream);border:1px solid var(--border);padding:1.75rem 2rem;margin:2rem 0;}
  .academic-note-label{font-size:0.68rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);margin-bottom:0.75rem;}
  .academic-note p{font-size:0.88rem;color:#5A5040;line-height:1.8;margin-bottom:0.6rem;}
  .academic-note p:last-child{margin-bottom:0;}

  /* NAV BETWEEN EXERCISES */
  .exercise-nav{display:flex;justify-content:space-between;align-items:center;padding:2rem 0;border-top:1px solid var(--border);margin-top:3rem;}
  .ex-nav-link{font-size:0.8rem;color:var(--gold);text-decoration:none;letter-spacing:0.06em;text-transform:uppercase;}
  .ex-nav-link:hover{opacity:0.75;}

  footer{background:#1A1810;padding:2rem 2.5rem;display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(255,255,255,0.06);flex-wrap:wrap;gap:1rem;}
  .footer-brand{font-family:'Lora',serif;font-size:0.9rem;color:#5A5040;text-decoration:none;}
  .footer-copy{font-size:0.75rem;color:#3A3020;}

  @media(max-width:900px){nav{padding:0 1.25rem;}.nav-links{display:none;}.hamburger{display:flex;}.timing-grid{grid-template-columns:1fr;}.article-body{padding:2.5rem 1.5rem 4rem;}.hero-inner{padding:0 1.5rem;}}
</style>
</head>
